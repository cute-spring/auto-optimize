# Metric profile: examples/metric_templates/embedding_metrics.yaml

schema_version: "0.2"

scenario:
  type: retrieval_embedding_benchmark
  name: "Chinese Embedding Accuracy Benchmark - DuRetrieval"

workspace:
  path: "./workspaces/duretrieval_benchmark"

editable_scope:
  - "configs/embedding.yaml"
  - "configs/retrieval.yaml"
  - "configs/query_processing.yaml"

protected_scope:
  - "data/"
  - "eval/"
  - ".env"
  - "secrets/"

search_space:
  embedding_model:
    values:
      - "bge-large-zh-v1.5"
      - "gte-multilingual-base"
      - "qwen3-embedding-4b"
    mapping:
      type: yaml_path
      file: "configs/embedding.yaml"
      path: "embedding.model_name"

  query_template:
    values:
      - "raw_query"
      - "normalized_query"
      - "keyword_augmented_query"
    mapping:
      type: yaml_path
      file: "configs/query_processing.yaml"
      path: "query.template"

  multilingual_normalization:
    values: [false, true]
    mapping:
      type: yaml_path
      file: "configs/query_processing.yaml"
      path: "query.multilingual_normalization"

  top_k:
    values: [10, 20, 50]
    mapping:
      type: yaml_path
      file: "configs/retrieval.yaml"
      path: "retrieval.top_k"

evaluation:
  command: "python eval/run_duretrieval_eval.py --json"
  output_format: json
  timeout_seconds: 2400

metrics:
  primary:
    name: "ndcg_at_10"
    direction: maximize
  secondary:
    - name: "top1_accuracy"
      direction: maximize
    - name: "recall_at_10"
      direction: maximize
    - name: "recall_at_50"
      direction: maximize
    - name: "mrr"
      direction: maximize
    - name: "embed_query_latency_p95_ms"
      direction: minimize
    - name: "embed_doc_latency_ms"
      direction: minimize
    - name: "index_size_mb"
      direction: minimize
    - name: "embedding_dimension"
      direction: minimize

constraints:
  embed_query_latency_p95_ms:
    max: 80
  index_size_mb:
    max: 4096

decision_policy:
  mode: constrained_primary_metric
  min_primary_improvement: 0.002

pareto:
  enabled: true
  profiles:
    - accuracy_first
    - balanced
    - latency_first
    - cost_first

run_policy:
  max_experiments: 30
  stop_if_no_improvement_rounds: 8
  random_seed: 42
  dry_run: false
  max_runtime_minutes: 180
  max_failed_evaluations: 5

version_control:
  enabled: true
  require_clean_worktree: true
  create_branch: true
  commit_accepted_changes: false
  rollback_rejected_changes: true
  branch_prefix: "auto-optimize/"
  push_remote: false
  create_pull_request: false

report:
  formats:
    - markdown
    - json
  output_dir: "auto_optimize_outputs"
