# Metric profile: examples/metric_templates/reranking_metrics.yaml

schema_version: "0.2"

scenario:
  type: reranking_benchmark
  name: "Chinese FAQ-like Reranking Benchmark - CMedQAv2"

workspace:
  path: "./workspaces/cmedqa_reranking_benchmark"

editable_scope:
  - "configs/retrieval.yaml"
  - "configs/reranker.yaml"
  - "configs/query_processing.yaml"

protected_scope:
  - "data/"
  - "eval/"
  - ".env"
  - "secrets/"

search_space:
  reranker_model:
    values:
      - "bge-reranker-v2-m3"
      - "qwen3-reranker-4b"
      - "gte-reranker-modernbert-base"
    mapping:
      type: yaml_path
      file: "configs/reranker.yaml"
      path: "reranker.model_name"

  rerank_top_n:
    values: [20, 50, 100]
    mapping:
      type: yaml_path
      file: "configs/reranker.yaml"
      path: "reranker.top_n"

  query_template:
    values:
      - "raw_query"
      - "normalized_query"
      - "faq_style_query"
    mapping:
      type: yaml_path
      file: "configs/query_processing.yaml"
      path: "query.template"

  initial_retrieval_top_k:
    values: [50, 100, 200]
    mapping:
      type: yaml_path
      file: "configs/retrieval.yaml"
      path: "retrieval.initial_top_k"

evaluation:
  command: "python eval/run_cmedqa_rerank_eval.py --json"
  output_format: json
  timeout_seconds: 2400

metrics:
  primary:
    name: "mrr"
    direction: maximize
  secondary:
    - name: "top1_accuracy"
      direction: maximize
    - name: "ndcg_at_10"
      direction: maximize
    - name: "rerank_gain_over_retrieval"
      direction: maximize
    - name: "recovered_at_1_from_top10"
      direction: maximize
    - name: "candidate_depth_sensitivity"
      direction: maximize
    - name: "rerank_latency_p95_ms"
      direction: minimize
    - name: "latency_per_candidate_ms"
      direction: minimize

constraints:
  rerank_latency_p95_ms:
    max: 200

decision_policy:
  mode: constrained_primary_metric
  min_primary_improvement: 0.002

pareto:
  enabled: true
  profiles:
    - accuracy_first
    - balanced
    - latency_first

run_policy:
  max_experiments: 24
  stop_if_no_improvement_rounds: 6
  random_seed: 42
  dry_run: false
  max_runtime_minutes: 120
  max_failed_evaluations: 5

version_control:
  enabled: true
  require_clean_worktree: true
  create_branch: true
  commit_accepted_changes: false
  rollback_rejected_changes: true
  branch_prefix: "auto-optimize/"
  push_remote: false
  create_pull_request: false

report:
  formats:
    - markdown
    - json
  output_dir: "auto_optimize_outputs"
