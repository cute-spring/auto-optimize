# Metric profile: examples/metric_templates/faq_metrics.yaml

schema_version: "0.2"

scenario:
  type: faq_retrieval
  name: "FAQ Retrieval Validation Example"

workspace:
  path: "workspace"

editable_scope:
  - "configs/retrieval.yaml"
  - "configs/reranker.yaml"
  - "configs/embedding_strategy.yaml"

protected_scope:
  - "data/"

search_space:
  top_k:
    values: [5, 10, 20]
    mapping:
      type: yaml_path
      file: "configs/retrieval.yaml"
      path: "retrieval.top_k"

  threshold:
    values: [0.78, 0.82, 0.86]
    mapping:
      type: yaml_path
      file: "configs/retrieval.yaml"
      path: "retrieval.threshold"

  reranker_enabled:
    values: [false, true]
    mapping:
      type: yaml_path
      file: "configs/reranker.yaml"
      path: "enabled"

  faq_embedding_template:
    values:
      - "question_only"
      - "question_with_answer"
      - "question_title_answer_bilingual"
    mapping:
      type: yaml_path
      file: "configs/embedding_strategy.yaml"
      path: "embedding.faq_template"

  query_embedding_template:
    values:
      - "raw_query"
      - "normalized_query"
      - "bilingual_expansion"
    mapping:
      type: yaml_path
      file: "configs/embedding_strategy.yaml"
      path: "embedding.query_template"

  multilingual_normalization:
    values: [false, true]
    mapping:
      type: yaml_path
      file: "configs/embedding_strategy.yaml"
      path: "embedding.multilingual_normalization"

evaluation:
  command: "python eval/run_eval.py --json"
  output_format: json
  timeout_seconds: 60

metrics:
  primary:
    name: "top1_accuracy"
    direction: maximize
  secondary:
    - name: "hit_at_3"
      direction: maximize
    - name: "recall_at_10"
      direction: maximize
    - name: "mrr"
      direction: maximize
    - name: "hard_negative_error_rate"
      direction: minimize
    - name: "embed_query_latency_p95_ms"
      direction: minimize
    - name: "rerank_latency_p95_ms"
      direction: minimize
    - name: "index_size_mb"
      direction: minimize

constraints:
  embed_query_latency_p95_ms:
    max: 120
  rerank_latency_p95_ms:
    max: 250
  index_size_mb:
    max: 4096
  all_tests_pass:
    required: true

decision_policy:
  mode: constrained_primary_metric
  min_primary_improvement: 0.001

pareto:
  enabled: true
  profiles:
    - accuracy_first
    - balanced
    - latency_first
    - cost_first

run_policy:
  max_experiments: 10
  stop_if_no_improvement_rounds: 4
  random_seed: 42
  dry_run: false
  max_runtime_minutes: 30
  max_failed_evaluations: 3

version_control:
  enabled: false
  require_clean_worktree: true
  create_branch: true
  commit_accepted_changes: false
  rollback_rejected_changes: true
  branch_prefix: "auto-optimize/"
  push_remote: false
  create_pull_request: false
  commit_message_template: |
    auto-optimize: {experiment_id} {summary}

report:
  formats:
    - markdown
    - json
  output_dir: "auto_optimize_outputs"
