schema_version: "0.2"

scenario:
  type: faq_retrieval
  name: "Minimal Custom Eval Starting Point"

workspace:
  path: "../faq_retrieval/workspace"

editable_scope:
  - "configs/retrieval.yaml"
  - "configs/reranker.yaml"

protected_scope:
  - "data/"
  - "eval/"

search_space:
  top_k:
    values: [5, 10, 20]
    mapping:
      type: yaml_path
      file: "configs/retrieval.yaml"
      path: "retrieval.top_k"
  reranker_enabled:
    values: [false, true]
    mapping:
      type: yaml_path
      file: "configs/reranker.yaml"
      path: "enabled"

evaluation:
  command: "python eval/run_eval.py --json"

metrics:
  primary:
    name: "top1_accuracy"
    direction: maximize
  secondary:
    - name: "rerank_latency_p95_ms"
      direction: minimize
