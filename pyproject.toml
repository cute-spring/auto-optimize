[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-optimize"
version = "0.1.0"
description = "Contract-driven optimization skill suite MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["auto_optimize*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
